name: Feishu Worker

# Long-running WebSocket worker for receiving Feishu IM events.
#
# Why GitHub Actions: 2026 年免费且不要信用卡的常驻 PaaS 几乎灭绝（Fly/Koyeb
# 都改成必须绑卡），公开仓库（ZhongJiaqi/mastermind）的 Actions 分钟数无限免费，
# 是「不花一分钱 + 不绑卡」唯一稳得住的方案。
#
# 每个 job 最长 6h 被 GH 硬杀，我们 timeout 设 358 min（5h58min）让进程主动
# 收到 SIGTERM 优雅断开，触发本 workflow 的 SIGTERM handler (scripts/feishu-worker.ts
# 已实现) 让 WS 干净断开释放 slot。cron 每 6h 启一次新 job + concurrency
# cancel-in-progress=true 让新 job 立即顶替老 job。切换期间 ~30-60s 的 WS
# 空窗，飞书 SDK 客户端会自动重连。
#
# 用法：
#   gh secret set -f .env.worker -R ZhongJiaqi/mastermind  # 一次性灌 11 个 secret
#   gh workflow run feishu-worker.yml -R ZhongJiaqi/mastermind  # 手动触发
#   gh run watch -R ZhongJiaqi/mastermind  # 看日志直到「ws client ready」

on:
  schedule:
    # 每 6 小时一次：UTC 00:00 / 06:00 / 12:00 / 18:00
    # 对应北京时间 08:00 / 14:00 / 20:00 / 02:00
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # 允许 gh workflow run / 网页手动触发

concurrency:
  group: feishu-worker
  cancel-in-progress: true  # 新 job 顶替老 job

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 358  # 5h58min，留 2min 给 SIGTERM 优雅退出
    steps:
      - uses: actions/checkout@v4
        with:
          # Worker 代码住在 feat/mastermind-v1，workflow 文件本身住在 main
          # （GH Actions 的 cron + dispatch 只看 default branch 上的 workflow）。
          ref: feat/mastermind-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Feishu worker
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MODEL_SYNTHESIZER: ${{ secrets.MODEL_SYNTHESIZER }}
          MODEL_HOST: ${{ secrets.MODEL_HOST }}
          MODEL_ADVISOR: ${{ secrets.MODEL_ADVISOR }}
          LLM_MODEL_CHAIN: ${{ secrets.LLM_MODEL_CHAIN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: npm start
